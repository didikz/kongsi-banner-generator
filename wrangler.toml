name = "kongsi-banner-generator"
main = "src/index.ts"
compatibility_date = "2026-10-30"

[assets]
directory = "./public"
binding = "ASSETS"
# Serve the HTML shell through the worker so it can set Cache-Control: no-transform.
run_worker_first = ["/", "/index.html"]

[[routes]]
pattern = "kongsibanner.didiktrisusanto.dev"
custom_domain = true

[observability]
enabled = true
